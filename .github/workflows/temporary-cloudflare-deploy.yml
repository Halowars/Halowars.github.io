name: Temporary Cloudflare deploy

on:
  push:
    branches:
      - road-dj-v2-auto-login-ui
    paths:
      - .github/workflows/temporary-cloudflare-deploy.yml

permissions:
  contents: read

env:
  DEPLOY_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAnp95d76GDS+0GnJUU6OS
    xTKpv+sdRsX8WlIb5ZxI/a3KRFp7VVexA9bvj1x94jkRvIkKsGAyKR1JLxLVq+V3
    Ovr5w2ImDw0ZpNx71MOvpAjkDRMtnEa7et7sGFAauNMBlaSD2kSxru0rrBqrIugZ
    kyL3v9W/VgY/l+whIKIQ6YC9siplp7IaUx7+qmPwUnX2AoLZLHi/237rycbjYVqv
    NQ0NvCip2uiN1YR3xVGSa9TzqnviBLvR9GMLPzTybWivQ734/e8OhEXc61iobkVG
    qGzizmKUQ12ifuPxa1oeZKRnTGDLCDEY2f4RQRiyvbukLcuZNP+OGuDSIfvYpD1Z
    hQIDAQAB
    -----END PUBLIC KEY-----

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare private deployment config
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_KEY="$(openssl rand -hex 24)"
          echo "$ADMIN_KEY" > /tmp/road-dj-admin-key
          python3 - <<'PY'
          from pathlib import Path
          admin = Path('/tmp/road-dj-admin-key').read_text().strip()
          text = Path('wrangler.toml').read_text()
          marker = '[vars]\n'
          if marker not in text:
              raise SystemExit('wrangler.toml has no [vars] block')
          text = text.replace(marker, marker + f'ADMIN_KEY = "{admin}"\n', 1)
          Path('wrangler.temp.toml').write_text(text)
          PY

      - name: Deploy temporary Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(npx --yes wrangler@latest deploy --temporary --config wrangler.temp.toml 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            printf '%s\n' "$OUTPUT" | sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#<claim-url-redacted>#g'
            exit "$STATUS"
          fi

          CLAIM_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' | tail -1)"
          WORKER_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -1)"
          if [ -z "$CLAIM_URL" ] || [ -z "$WORKER_URL" ]; then
            printf '%s\n' "$OUTPUT" | sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#<claim-url-redacted>#g'
            echo 'Could not parse deployment URLs.'
            exit 1
          fi

          echo "$WORKER_URL" > worker_url.txt
          printf '{"claim_url":"%s","admin_key":"%s"}\n' "$CLAIM_URL" "$(cat /tmp/road-dj-admin-key)" > deployment-secrets.json

          printf '%s\n' "$DEPLOY_PUBLIC_KEY" > deploy-public.pem
          PASSPHRASE="$(openssl rand -hex 32)"
          printf '%s' "$PASSPHRASE" > deployment-passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -in deployment-secrets.json -out deployment-secrets.enc -pass pass:"$PASSPHRASE"
          openssl pkeyutl -encrypt -pubin -inkey deploy-public.pem -pkeyopt rsa_padding_mode:oaep -in deployment-passphrase.txt -out deployment-key.enc

          rm -f deployment-secrets.json deployment-passphrase.txt deploy-public.pem wrangler.temp.toml /tmp/road-dj-admin-key
          echo "Temporary Worker deployed: $WORKER_URL"

      - name: Upload encrypted deployment handoff
        uses: actions/upload-artifact@v4
        with:
          name: road-dj-cloudflare-handoff
          path: |
            worker_url.txt
            deployment-secrets.enc
            deployment-key.enc
          retention-days: 1
          if-no-files-found: error
