name: Validate Road DJ v3

on:
  push:
    branches:
      - road-dj-speed-ui-v3
    paths:
      - .github/workflows/road-dj-v3-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and DOM references
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          js = Path('app.js').read_text()
          html_ids = set(re.findall(r'id="([^"]+)"', html))
          refs = set(re.findall(r"getElementById\('([^']+)'\)", js))
          missing = sorted(refs - html_ids)
          if missing:
              raise SystemExit(f'Missing DOM ids: {missing}')
          if "'Content-Type': 'application/json'" in js and 'options.body' not in js:
              raise SystemExit('Bodyless API calls still force Content-Type')
          print(f'OK: {len(refs)} DOM references resolved')
          PY
